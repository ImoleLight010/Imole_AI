<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f13" />
  <title>IMOLE AI</title>
  <meta name="description" content="IMOLE AI - your smart assistant." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="extra.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <button id="menu" class="icon" type="button" aria-label="Chat history">&#9776;</button>
        <span class="logo" aria-hidden="true">&#9728;</span>
        <div>
          <h1>IMOLE AI</h1>
          <p>Light for your ideas</p>
        </div>
      </div>
      <button id="newChat" class="ghost" type="button">New chat</button>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <section id="welcome" class="welcome">
        <h2>Hello, I'm IMOLE AI</h2>
        <p>Ask me anything: coding, design, tech, business, learning and more.</p>
        <div class="chips">
          <button class="chip" type="button">Explain how a website works</button>
          <button class="chip" type="button">Write a Python function to sort a list</button>
          <button class="chip" type="button">Give me 5 motivational quotes</button>
          <button class="chip" type="button">Tips for a clean mobile UI design</button>
        </div>
      </section>
    </main>

    <form id="form" class="composer" autocomplete="off">
      <textarea id="input" rows="1" maxlength="2000" placeholder="Message IMOLE AI..." enterkeyhint="send"></textarea>
      <button id="send" type="submit" aria-label="Send">&#10148;</button>
    </form>
    <p class="note">IMOLE AI can make mistakes. Check important information.</p>
  </div>

  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Chat history">
    <div class="drawer-head">
      <strong>Your chats</strong>
      <button id="closeDrawer" class="icon" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="convList" class="conv-list"></div>
    <div class="drawer-foot">
      <span id="userEmail" class="user-email"></span>
      <button id="logout" class="ghost" type="button">Log out</button>
    </div>
  </aside>

  <section id="auth" class="auth" hidden>
    <form id="authForm" class="auth-card">
      <div class="logo big" aria-hidden="true">&#9728;</div>
      <h2 id="authTitle">Log in to IMOLE AI</h2>
      <p class="auth-sub">Your chats are saved to your account.</p>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="Email" required />
      <input id="password" type="password" autocomplete="current-password" placeholder="Password (min 8 characters)" minlength="8" required />
      <p id="authMsg" class="auth-msg" role="alert"></p>
      <button id="authBtn" class="primary" type="submit">Log in</button>
      <button id="authSwitch" class="link" type="button">New here? Create an account</button>
    </form>
  </section>

  <script src="app.js"></script>
</body>
          </html>
